[package]
name = "proof-of-score-bounty"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-chain scored optimization bounties for AI agents on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.5.7"
schemars = "0.8.22"
near-sdk = { version = "5.30.0", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["legacy", "unit-testing", "abi"] }
